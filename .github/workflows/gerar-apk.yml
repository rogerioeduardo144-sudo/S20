name: Gerar APK PULSO
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar API 35 usando o SDK do runner
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Testar motor estatístico
        run: |
          mkdir -p /tmp/pulso-test
          javac -encoding UTF-8 -d /tmp/pulso-test app/src/main/java/br/com/pulso/mercado/SignalEngine.java tests/TestSignal.java
          java -cp /tmp/pulso-test TestSignal
      - name: Compilar APK Android
        run: gradle --no-daemon :app:assembleDebug
      - name: Conferir integridade, API 35 e assinatura do APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK/build-tools/35.0.0/aapt" dump badging "$APK" | grep "targetSdkVersion:'35'"
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PULSO-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
