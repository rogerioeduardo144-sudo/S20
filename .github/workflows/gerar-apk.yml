name: Gerar APK PULSO
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android
        uses: android-actions/setup-android@v3
      - name: Instalar API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Testar motor estatístico
        run: |
          mkdir -p /tmp/pulso-test
          javac -encoding UTF-8 -d /tmp/pulso-test app/src/main/java/br/com/pulso/mercado/SignalEngine.java tests/TestSignal.java
          java -cp /tmp/pulso-test TestSignal
      - name: Compilar APK Android
        run: gradle --no-daemon :app:assembleDebug
      - name: Conferir existência e integridade do APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PULSO-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
