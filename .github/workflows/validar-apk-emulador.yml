name: Testar instalação real em emulador Android 13
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validar-apk-emulador.yml'
      - 'app/**'
concurrency:
  group: pulso-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Habilitar virtualização KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar, abrir e acionar janela no Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            echo "----- ANDROID -----"
            adb shell getprop ro.build.version.release
            echo "----- INSTALAR -----"
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            echo "----- VERIFICAR INSTALAÇÃO -----"
            adb shell pm path br.com.pulso.mercado.v26 | grep "package:"
            echo "----- INICIAR -----"
            adb shell am start -W -n br.com.pulso.mercado.v26/br.com.pulso.mercado.MainActivity
            sleep 8
            adb shell pidof br.com.pulso.mercado.v26
            echo "----- JANELA FLUTUANTE -----"
            adb shell appops set br.com.pulso.mercado.v26 SYSTEM_ALERT_WINDOW allow
            echo "----- ACIONAR JANELA PELO APLICATIVO -----"
            FOUND=""
            for ATTEMPT in 1 2 3 4; do
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb shell cat /sdcard/window.xml > /tmp/pulso_screen.xml
              FOUND=$(python3 - <<'PY'
import re
screen=open('/tmp/pulso_screen.xml',encoding='utf-8').read()
for match in re.finditer(r'<node\\b[^>]*>',screen):
    node=match.group(0)
    if 'text="Ativar janela flutuante"' not in node:
        continue
    bounds=re.search(r'bounds="\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]"',node)
    if bounds:
        x1,y1,x2,y2=map(int,bounds.groups())
        print((x1+x2)//2,(y1+y2)//2)
        break
PY
)
              if [ -n "$FOUND" ]; then break; fi
              adb shell input swipe 530 1650 530 400 400
              sleep 1
            done
            test -n "$FOUND"
            read -r X Y <<< "$FOUND"
            adb shell input tap "$X" "$Y"
            sleep 5
            adb shell dumpsys activity services br.com.pulso.mercado.v26 | grep -F "OverlayService"
            echo "----- CRASH LOG -----"
            adb logcat -d -v brief -s AndroidRuntime:E > /tmp/pulso_runtime.txt || true
            cat /tmp/pulso_runtime.txt | tail -n 60
            if grep -q "Process: br.com.pulso.mercado.v26" /tmp/pulso_runtime.txt; then
              echo "ERRO: crash do PULSO identificado"
              exit 1
            fi
            echo "PASSOU: instalado e iniciou sem crash detectado"
      - name: Publicar APK testado
        uses: actions/upload-artifact@v4
        with:
          name: PULSO-Android-13-Testado
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
