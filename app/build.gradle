plugins { id 'com.android.application' }
android {
    namespace 'br.com.pulso.mercado'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.pulso.mercado'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '2.5-testes'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
